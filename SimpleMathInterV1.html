<title>:: My Own Interpreter ::</title> 
<body onload="start()">
  <pre   id="bnfID"></pre>
  <input id="inEquID" type="text" size="80" placeholder="Enter your equation">
  <button id="genButID" type="button" onclick="logic.genEqua()">Generate</button>
  <button id="compButID" type="button" onclick="logic.compute()">Compute</button>
  <pre   id="shEqID"></pre>
  <pre   id="rslEqID"></pre>
</body>
<script>
const bnf = {};
const or  = "|";
bnf["number"]     = [ /^(\d+(\.\d*)?)/, (a)=>Number.parseFloat(a)];
bnf["immediate"]  = ["parcond", or, "number"];
bnf["factor"]     = [/^[+-]/, "immediate",          (op,a)=>op==="+"?a:-a,      or, "immediate"];
bnf["term"]       = ["factor", /^[*/]/, "term",     (a,op,b)=>op==="*"?a*b:a/b, or, "factor"];
bnf["expression"] = ["term", /^[+-]/, "expression", (a,op,b)=>op==="+"?a+b:a-b, or, "term"];
bnf["parcond"]    = [/^\(/, "expression", /^\)/,    (lp,a,rp)=>a];

function SRC(text) {
  const getPos = () =>cPos;
  const setPos = (p)=>cPos=p;
  const getSrc = () =>text;
  const getMaxPos = ()=>mPos;
  const showCur   = ()=>text.substring(0,cPos)+"||"+text.substring(cPos);
  let cPos = 0;
  let mPos = 0;
  function match(regExp) {
    let ma = text.substring(cPos).match(regExp);
    if (ma) {
      ma = ma[0];
      cPos += ma.length;
      mPos = Math.max(mPos,cPos);
    }
    return ma;
  }
  function checkError() {
    let error = false;
    if (cPos < text.length) {
      console.log("Partial ", text.substring(0,cPos),
                  "left",     text.substring(cPos));
      error = true;
    } 
    if (cPos !== mPos) {
      console.log("Backtracking", text.substring(0,cPos),
                  "to",           text.substring(cPos, mPos),
                  "left",         text.substring(mPos));
      error = true;
    }
    return error;
  }
  return {getPos, setPos, getMaxPos, getSrc, checkError, showCur, match}
}

function HTML() {
  const isOprNode = (node)=>Array.isArray(node) && typeof node[0] === "function";
  function showBNF(bnf) {
    bnfID.innerHTML = "";
    const ruleNames = Object.keys(bnf);
    const maxLen   = Math.max(...ruleNames.map(str=>str.length));
    for (const ruleName of ruleNames) {
      const prm = bnf[ruleName];
      bnfID.innerHTML += ruleName.padEnd(maxLen+1)+" ::= ";
      let str = "";
      for (let ip=0; ip<prm.length; ip++) {
        const onePrm = prm[ip];
        if (typeof onePrm === "string") {
          str += " "+((onePrm==="|")?"OR":onePrm)+" ";
        } else if (typeof onePrm === "function" || onePrm instanceof RegExp) {
          str += " "+onePrm.toString()+" ";
        }
      }
      bnfID.innerHTML += str+"<br>";
    }
  }
  function showTree(tree) {
    let mathStr = "";
    if (isOprNode(tree)) {
      for (let iPrm=1; iPrm<tree.length; iPrm++) {
        let prm = tree[iPrm];
        if (isOprNode(prm)) {
          let str = showTree(prm);
          if (prm.length>2 && prm[1]!=="(" && tree[1]!="(") {
            str = "["+str+"]"
          }
          mathStr += str;
        } else if (typeof prm === "string") {
          mathStr += prm;
        } else {
          console.log("No idea why I'm here");
        }
      }
    }
    return mathStr;
  }
  function show2Lines(tree) {
    const str = showTree(tree);
    let   tLine = str.replaceAll("[", " ");
          tLine = tLine.replaceAll("]", " ");
    shEqID.innerHTML = "From: "+tLine+"\n"+"To:   "+str;
  }
  return {showBNF, showTree, show2Lines};
}

function BNF(bnf) {
  const isOprNode = (node)=>Array.isArray(node) && typeof node[0] === "function";
  const gBnf = {};
  function buildTree(src, ruleName) {
    var tree = [];
    const rule = bnf[ruleName];
    if (rule) {
      let newOpt    = false;
      let searching = true;
      let sPos      = src.getPos();
      for (let iKW=0; iKW<rule.length && searching; iKW++) {
        const kw = rule[iKW];
        if (newOpt) {
          if (kw === or) {
            newOpt = false;
            tree   = [];
            src.setPos(sPos);
          }
        } else {
          if (kw instanceof RegExp) {
            const found = src.match(kw);
            if (found) {
              tree.push(found);
            } else {
              newOpt = true;
              tree   = [];
            }
          } else if (typeof kw === "function") {
            tree.unshift(kw);
            searching = false;
          } else if (bnf[kw]) {
            const subTree = buildTree(src, kw);
            if (subTree.length) {
              tree.push((subTree.length==1)?subTree[0]:subTree);
            } else {
              newOpt = true;
              //tree   = [];
            }
          } else if (kw === or) {
            searching = false;
          } else {
            console.log("No idea what I'm doing here");
          }
        }
      }
    }
    return tree;
  }
  function reBalance(tree) {
    if (Array.isArray(tree) && tree.length) {
      if (tree.length === 1) {
        tree = reBalance(tree[0]);
      } else if (typeof tree[0] === "function") {
        for (let iPrm=1; iPrm<tree.length; iPrm++) {
          if (isOprNode(tree[iPrm])) {
            tree[iPrm] = reBalance(tree[iPrm]);
          }
        }
        if (tree.length === 4 && 
            (((tree[2] === "-" || tree[2] === "+") && (tree[3][2] === "-" || tree[3][2]==="+")) ||
             ((tree[2] === "/" || tree[2] === "*") && (tree[3][2] === "/" || tree[3][2]==="*")))) {
          const top = tree[3];
          const mBr = top[1];
          top[1]  = tree;
          tree[3] = mBr;
          tree = reBalance(top);
        }
      }
    }
    return tree;
  }
  function evalTree(tree) {
    let rsl = tree;
    if (Array.isArray(tree) && tree.length) {
      if (tree.length ===1) {
        rsl = evalTree(tree[0]);
      } else {
        let nodes = [];
        for (let iNode=1; iNode<tree.length; iNode++) {
          nodes.push(evalTree(tree[iNode]));
        }
        rsl = tree[0](...nodes);
      }
    }
    return rsl;
  }
  function genBnf() {
    for (const ruleName of Object.keys(bnf)) {
      let opts = [];
      let opt = [];
      const rule = bnf[ruleName];
      for (ir=0; ir<rule.length; ir++) {
        const prm = rule[ir];
        if (prm == or) {
          opts.push(opt);
          opt = [];
        } else if (prm  instanceof RegExp) {
          const strReg = prm.toString();
          opt.push(strReg.substring(3,strReg.length-1).replace(/[\[\]]/g, ""));
        } else if (typeof prm !== "function") {
          opt.push(prm);
        }
      }
      opts.push(opt);
      gBnf[ruleName] = opts;
    }
    console.log(gBnf);
  }
  function genEqua(dif, ruleName) {
    const random = (n)=>Math.floor(Math.random() * (n));
    let strEq = "";
    const rule = gBnf[ruleName];
    const opt = (dif>0)?rule[random(rule.length)]:rule[rule.length-1];
    for (const prm of opt) {
      if (prm==="number") {
        strEq += (1+random(10)).toString();
      } else if (gBnf[prm]) {
        strEq += genEqua(dif-1, prm);
      } else {
        strEq += prm.charAt(random(prm.length));
      }
    }
    return strEq.replace("++", "+").replace("--", "-");  // Javascript do not like it
  }
  genBnf();
  return {buildTree, reBalance, evalTree, genEqua}
}

function LOGIC(pBNF, html) {
  function compute() {
    const src  = SRC(inEquID.value);
    let tree  = pBNF.buildTree(src, "expression");
    tree = pBNF.reBalance(tree);
    html.show2Lines(tree);
    if (!src.checkError()) {
      const intRsl = pBNF.evalTree(tree);
      const jsRsl  = eval(src.getSrc());
      rslEqID.innerHTML = (intRsl===jsRsl?"You WIN!!":"NOT THE SAME RESULT!!")+
         " Interpreter: "+intRsl+" Javascript: "+jsRsl;
    }
  }
  function genEqua() {
    let maxTry = 10;
    let strEq = "";
    while (maxTry>0 && strEq.length<20) {
      strEq = pBNF.genEqua(10, "expression");
    }    
    inEquID.value = strEq;
  }
  return {compute, genEqua};
}
const pBNF  = BNF(bnf);
const html  = HTML();
const logic = LOGIC(pBNF, html);

function start() {
  inEquID.value = "100/-(10-20-20+20)/-(5*2/2*2/2)*-(-(10/5/2)-3)";
  html.showBNF(bnf);
  console.log("Started");
  console.log(pBNF.genEqua(10,"expression"));
}
</script>
